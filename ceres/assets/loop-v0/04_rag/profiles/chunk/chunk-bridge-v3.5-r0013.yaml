# chunk-bridge-v3.5 for release-attempt-0013: identical rules to chunk-bridge-v3.5.yaml; only context_artifacts
# point at the release-0013 context build (04_rag/code/build_v35_context.py over this release's pre-dedup candidates).
# The profile id stays chunk-bridge-v3.5 because slot_adapter keys behaviour on it. prepare_release_route.py from r0011
profile_schema_version: dds-loop-rag-slot-profile-v1
slot: chunk
profile_id: chunk-bridge-v3.5
output_schema_version: dds-loop-rag-chunks-v1
window_tokens: 350
overlap_tokens: 53
tokenizer: unicode-whitespace-python-regex
normalization_version: null
eligibility_rule: located-unique-critical-exact-span-union-minus-explicit-redactions
eligible_input_strategy: split-at-excluded-span
gap_bridging: no_alphanumeric
located_match_levels: [exact, normalized, fuzzy]
require_unique_on_page: true
fuzzy_max_char_error_rate: 0.02
fuzzy_min_token_similarity: 0.98
require_exact_critical_fields: true
hard_exclusion_reasons:
  - equation_unconfirmed
  - page_furniture
  - placeholder_element
  - si_corruption
  - table_unvalidated
  - truncated_selection
# Section-level evidence disqualification.
#
# hard_exclusion_reasons above acts on ELEMENTS inside a section: a flagged element's
# span is redacted out of the eligible spans. It never acts on the SECTION-level
# excluded_reasons that 02_release/adapters/manifests_v1.py folds in from the x0/x1
# sidecar structural flags. So a whole yield-table page flagged table_unvalidated still
# produced evidence-eligible chunks under v3.1, and the packet quoted numbers whose
# verbatim row cannot be quoted.
#
# evidence_disqualifying_reasons names the section-level reasons that make a section's
# chunks non-evidence. When a section's excluded_reasons carries any of them:
#   - the parent chunk and every child of that section get evidence_eligible: false;
#   - eligibility_basis gains "disqualifying_reasons" on parent and children, and
#     ELIGIBILITY-AUDIT.json gains the declared list plus the disqualified sections.
#
# Declaring the key also turns on WIDE inheritance: every child inherits the parent's full excluded_reasons list, whether or not
# the section is disqualified. Children otherwise carry [] under v3, so a consumer had
# to walk to the parent to see any section flag. With this on, the serving store is
# self-describing for all section flags without a parent join, which is what `dds load`
# already does on the CLI side.
#
# The key is absent from every other chunk profile, and an absent key is exactly the
# pre-2026-09-13 behaviour, so chunk-bridge-v3.1 output stays byte-identical.
#
# Windowing is deliberately NOT changed: the payload, the spans and the chunk ids of a
# disqualified section are the same as under v3.1, so its chunks stay retrievable as
# context and only their evidence status changes.
evidence_disqualifying_reasons:
  - table_unvalidated
# Child chunk-id identity rule. v3.2 is chunk-bridge-v3.1 with salted child ids: the
# windowing, eligibility, redaction and gap-bridging behaviour is byte-identical to
# v3.1; only the chunk_id derivation changes.
#
# Why: the v3.1 identity string is content-derived only. It is
#   f"{release_id}{output_sha}{profile_id}{window_index}{char_start}:{char_end}"
# and for every non-x2 route output_sha == sha256(parent payload), so two parents whose
# whole payload is the same short string (an atlas page whose only eligible text is
# "Precipitation") produce the SAME child chunk_id under different parent_id values.
# Observed: 04_rag/runs/slice-v0/chunk/r1-chunk-attempt-0036/chunks.jsonl holds 595 rows
# with 581 distinct chunk_id values (10 colliding ids).
#
# v3.2 identity string (UTF-8; chunk_id = sha256(identity_string).hexdigest):
#
#   "dds-loop/chunk-identity/v3.2" + US + parent_id + US + window_index + US + payload_sha256
#
# where
#   US             = U+001F UNIT SEPARATOR (one character, "\x1f"). parent_id must not
#                    contain it; the adapter raises AdapterError(3) if it does, so the
#                    four-field encoding is injective.
#   parent_id      = the parent section id (the release row's section_id, i.e. the
#                    parent chunk row's chunk_id) — the salt that separates identical
#                    payloads on different pages.
#   window_index   = the child window ordinal inside that parent, base-10, unpadded,
#                    starting at 0 (the row's window_index field, str(int)).
#   payload_sha256 = 64 lowercase hex digits, sha256 of the UTF-8 bytes of the child
#                    window payload (the row's payload_sha256 field).
#
# release_id and profile_id are deliberately NOT in the v3.2 string: parent section ids
# already carry the document identity, so an id is stable across releases and across
# re-runs of the same content, which is what the Ceres serving route needs.
identity_version: v3.2
env_lock: 00_control/requirements.lock
env_lock_sha256: 4289e0efb67453c88bfbb48e1831deb633a9f55f67016b18d6a02ccc5ba00418
hardware_flags: {device: cpu, deterministic: true}
output_schemas:
  chunks.jsonl: dds-loop-rag-chunks-v1
  chunk-locators.jsonl: dds-loop-rag-chunk-locator-map-v1
  source-locators.jsonl: dds-loop/locator/v1
  source-lineage.jsonl: dds-loop/lineage/v1
  ELIGIBILITY-AUDIT.json: dds-loop-rag-eligibility-audit-v1
  child-context.jsonl: dds-loop-rag-child-context-v1
  not-indexed.jsonl: dds-loop-rag-not-indexed-v1
  keys.jsonl: dds-loop/keys/v1
# Per-work OCR admission (overrides the default for listed works only).
#
# v3.3 is chunk-bridge-v3.2 byte for byte (windowing, eligibility, redaction, gap
# bridging, disqualification, v3.2 child identity) plus this key. It acts only on a
# section that meets ALL of:
#   - route x2;
#   - its x2 attempt's MANIFEST.json source_sha256 is a content_sha256 in `declarations`
#     (rows: content_sha256, work_slug, decided_by, decided_at, scope: rnd_only, note),
#     and the declared work_slug equals that manifest's item_id (a disagreement refuses);
#   - the locator's match is level `unmatched` with reason `no_text_layer` (a scan page:
#     x2 could not confirm because there is no text layer to confirm against).
# Such spans are NOT redacted: they are windowed into children like confirmed text, and
# every child (and parent) holding them carries `evidence_basis: ocr_admitted_unverified`.
# No other row gains the field, so non-admitted works produce v3.2's rows.
#
# Tripwire: the deterministic page runaway screen (01_extract/checks/ocr_runaway_screen.py)
# must exist at `runaway_screen_dir`/runaway-<x2 attempt name>.json and match the
# attempt's elements.jsonl sha256; otherwise the adapter refuses. A flagged page keeps
# every v3.2 redaction and gains one `ocr_runaway` redaction per admitted span.
#
# Untouched: `not_in_text_layer` (a real text layer disagrees), non-unique and fuzzy
# locators, element hard exclusions, section disqualification (table_unvalidated),
# x0/x1 sections of an admitted work. Serving: rnd only; production refuses the basis.
ocr_admission:
  declarations: 02_release/declarations/ocr-admissions.jsonl
  runaway_screen_dir: 01_extract/checks
  basis: ocr_admitted_unverified
  serving_modes: [rnd]
# chunk-bridge-v3.4 keys kept in v3.5: (a) non_unique_bridging, unchanged (see chunk-bridge-v3.4.yaml for the rule).
# v3.4's (b) min_child_chars (with its exemption) and (c) context-blind payload_dedup are NOT in v3.5; they are replaced
# below. chunk-bridge-v3.4 itself is unchanged and stays byte-identical.
non_unique_bridging: {reasons: [non_unique_locator], require_unique_in: section_payload}
# chunk-bridge-v3.5 (rules A1-A6;
#
# min_child_tokens: a window with fewer whitespace tokens (Python str.split, exactly as the retrieve slot's
#    min_context_tokens and Ceres count) is not emitted. Route freeze (run_route.load_route) refuses a route whose
#    retrieve min_context_tokens differs from this value.
min_child_tokens: 21
# Short-window join: a short window joins an adjacent window of the SAME contiguous eligible segment (after exclusions and the
#    v3.1/v3.4 bridges); the child is the parent slice over the union of both offset ranges (no concatenation, no
#    duplicated overlap), at most window_tokens + min_child_tokens tokens. No safe neighbour -> not indexed
#    (below_floor_unmergeable). With window 350 / overlap 53 a short window is always a whole segment, so no join
#    can happen on this profile; the rule is kept so a smaller overlap cannot silently cross segments.
short_window_join: {scope: same_eligible_segment, max_tokens: window_plus_floor}
# Heading carriers, BOOKS ONLY (these cohorts and routes; never mars_industry: MARS headings are misaligned with their
#    text in 415 / 510 country sections): an evidence-eligible, not disqualified section whose whole payload is under
#    the floor and heading-shaped (part/chapter label, numbered heading, or an upper-case/title line; never a
#    sentence, warning, caption, numeric row or fragment) is not indexed (reason heading_carrier) and enters the
#    heading stack. Numbered ancestry is validated ("5.1" never under "4."); equal/deeper levels pop; an unnumbered
#    heading clears its dependents; the stack resets at work end, order gaps, out-of-scope rows and every section that
#    neither carries nor opens with a validated heading (or holds an interior heading line). Children get
#    child-context.jsonl heading_path {value, status, basis}; retrieval context only, never citable (I5).
heading_carry: {rule: a3-v1, cohorts: [ebooks_2026, bogdan_ro_tier1], routes: [x0, x1]}
# not-indexed spans (below_floor_unmergeable, heading_carrier) are listed in not-indexed.jsonl and in the parent's
#    eligibility_basis.not_indexed; parent eligibility and provenance are unchanged. A5 audit: ELIGIBILITY-AUDIT.json
#    chunk_v35 (release totals and per work).
# release-wide dedup keyed on (payload_sha256, evidence_eligible, evidence_basis, context_fingerprint, heading_key):
#    identical text from two issues or two places stays two children. The context fingerprint is read from the
#    chunk-context artifact below, which 04_rag/code/build_v35_context.py builds with 04_rag/context_v35.py over THIS
#    profile's pre-dedup candidates; the build refuses an artifact bound to other candidates, another release
#    manifest or other context code.
payload_dedup: {scope: release, keep: first_in_release_order, record_aliases: true, context_aware: true}
# D9 extension point: the three files enter the chunk cache key (their sha256). OWNER: point these at the context
# build of the release this profile serves (release 8 serve product here), built with build_v35_context.py.
context_artifacts:
  chunk_context: {path: 04_rag/context/v35/release-all-0013-serve/chunk-context.jsonl}
  context_manifest: {path: 04_rag/context/v35/release-all-0013-serve/CONTEXT-MANIFEST.json}
  page_facts: {path: 04_rag/context/v35/release-all-0013-serve/page-facts.jsonl}
